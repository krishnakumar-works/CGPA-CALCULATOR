<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGPA Calculator</title>
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#14213d; --muted:#5b6b82; --line:#d5dde8;
  --accent:#0f6b6b; --accent-ink:#ffffff; --bad:#b3261e; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1522; --card:#17202f; --ink:#e8edf5; --muted:#93a1b8; --line:#2b3850;
        --accent:#4fc3b8; --accent-ink:#0e1522; --bad:#ff8a80; color-scheme:dark;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
h2{font-size:1.1rem;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif}
th{text-align:left;font-weight:600;font-size:.85rem;color:var(--muted);padding:0 8px 8px}
td{padding:6px 8px;border-top:1px solid var(--line)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
input,select{width:100%;padding:8px 10px;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.invalid{border-color:var(--bad)}
button{font:600 .95rem system-ui,sans-serif;padding:9px 16px;border-radius:6px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.x{padding:6px 10px;border-color:var(--line);color:var(--muted);background:transparent}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.prev{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-family:system-ui,sans-serif}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.result{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;font-family:system-ui,sans-serif}
.stat span{display:block;font-size:.85rem;color:var(--muted)}
.stat b{font:700 1.5rem Georgia,serif;font-variant-numeric:tabular-nums}
.cgpa b{font-size:2.6rem;color:var(--accent)}
.msg{color:var(--bad);font:.9rem system-ui,sans-serif;min-height:1.3em;margin:10px 0 0}
.scroll{overflow-x:auto}
@media (max-width:520px){.prev{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>CGPA Calculator</h1>
  <p class="sub">Enter each course, its grade and credit hours. Results update as you type.</p>

  <section class="card">
    <h2>This semester's courses</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Course</th><th style="width:110px">Grade</th><th style="width:100px">Credits</th>
          <th style="width:90px;text-align:right">Grade pts</th><th style="width:44px"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="actions">
      <button id="add" type="button">Add course</button>
      <button id="reset" type="button" class="ghost">Clear all</button>
    </div>
    <p class="msg" id="msg" role="alert"></p>
  </section>

  <section class="card">
    <h2>Previous semesters (optional)</h2>
    <div class="prev">
      <div><label for="pc">Credit hours completed so far</label>
        <input id="pc" type="number" min="0" step="0.5" placeholder="0"></div>
      <div><label for="pg">Previous CGPA (0–4)</label>
        <input id="pg" type="number" min="0" max="4" step="0.01" placeholder="0.00"></div>
    </div>
  </section>

  <section class="card">
    <h2>Result</h2>
    <div class="result">
      <div class="stat"><span>Total credits</span><b id="tc">0</b></div>
      <div class="stat"><span>Total grade points</span><b id="tp">0.00</b></div>
      <div class="stat"><span>Semester GPA</span><b id="gpa">0.00</b></div>
      <div class="stat cgpa"><span>Overall CGPA</span><b id="cgpa">0.00</b></div>
    </div>
  </section>
</main>

<script>
const SCALE = {"A+":4.0,"A":4.0,"A-":3.7,"B+":3.3,"B":3.0,"B-":2.7,"C+":2.3,"C":2.0,"C-":1.7,"D+":1.3,"D":1.0,"F":0.0};
const rows = document.getElementById("rows");
const msg = document.getElementById("msg");
let count = 0;

function addRow(name = "", grade = "A", credits = "") {
  count++;
  const tr = document.createElement("tr");
  const options = Object.keys(SCALE)
    .map(g => `<option${g === grade ? " selected" : ""}>${g}</option>`).join("");
  tr.innerHTML = `
    <td><input class="name" type="text" placeholder="Course ${count}" aria-label="Course name" value="${name}"></td>
    <td><select class="grade" aria-label="Grade">${options}</select></td>
    <td><input class="credits" type="number" min="0.5" max="30" step="0.5" placeholder="3" aria-label="Credit hours" value="${credits}"></td>
    <td class="num pts">0.00</td>
    <td><button class="x" type="button" aria-label="Remove course">✕</button></td>`;
  tr.querySelector(".x").onclick = () => { tr.remove(); calculate(); };
  tr.addEventListener("input", calculate);
  rows.appendChild(tr);
}

function calculate() {
  let totalCredits = 0, totalPoints = 0, problem = "";

  rows.querySelectorAll("tr").forEach(tr => {
    const cInput = tr.querySelector(".credits");
    const credits = parseFloat(cInput.value);
    const points = SCALE[tr.querySelector(".grade").value];
    const bad = cInput.value !== "" && !(credits >= 0.5 && credits <= 30);
    cInput.classList.toggle("invalid", bad);
    if (bad) problem = "Credit hours must be between 0.5 and 30.";

    if (credits >= 0.5 && credits <= 30) {
      totalCredits += credits;
      totalPoints += credits * points;
      tr.querySelector(".pts").textContent = (credits * points).toFixed(2);
    } else {
      tr.querySelector(".pts").textContent = "0.00";
    }
  });

  const pcEl = document.getElementById("pc"), pgEl = document.getElementById("pg");
  const prevCredits = parseFloat(pcEl.value) || 0;
  const prevCgpa = parseFloat(pgEl.value) || 0;
  const pcBad = pcEl.value !== "" && prevCredits < 0;
  const pgBad = pgEl.value !== "" && (prevCgpa < 0 || prevCgpa > 4);
  pcEl.classList.toggle("invalid", pcBad);
  pgEl.classList.toggle("invalid", pgBad);
  if (pcBad || pgBad) problem = "Previous credits must be 0 or more, and previous CGPA between 0 and 4.";
  msg.textContent = problem;

  const gpa = totalCredits ? totalPoints / totalCredits : 0;
  const allCredits = prevCredits + totalCredits;
  const cgpa = allCredits ? (prevCgpa * prevCredits + totalPoints) / allCredits : 0;

  document.getElementById("tc").textContent = totalCredits.toFixed(1);
  document.getElementById("tp").textContent = totalPoints.toFixed(2);
  document.getElementById("gpa").textContent = gpa.toFixed(2);
  document.getElementById("cgpa").textContent = cgpa.toFixed(2);
}

document.getElementById("add").onclick = () => { addRow(); calculate(); };
document.getElementById("reset").onclick = () => {
  rows.innerHTML = ""; count = 0;
  document.getElementById("pc").value = ""; document.getElementById("pg").value = "";
  addRow(); calculate();
};
document.getElementById("pc").addEventListener("input", calculate);
document.getElementById("pg").addEventListener("input", calculate);

addRow("Mathematics", "A", 3);
addRow("Physics", "B+", 4);
addRow();
calculate();
</script>
</body>
</html>
